name: Publicar el demo

# El demo es la única parte de Relevo que se puede ver sin base de datos ni
# sesión: son los componentes reales con datos de prueba en memoria. Se publica
# en GitHub Pages para poder abrirlo desde el teléfono.
#
# Se dispara a mano, no en cada push. GitHub Pages hay que habilitarlo una vez
# desde Settings → Pages → Source: GitHub Actions; el token de un workflow no
# tiene permiso para habilitarlo solo. Mientras no esté habilitado, correr esto
# en cada push solo dejaría un error rojo en cada commit.
#
# Para el teléfono no hace falta: para eso está el APK (.github/workflows/apk.yml).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
