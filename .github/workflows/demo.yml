name: Publicar el demo

# El demo es la única parte de Relevo que se puede ver sin base de datos ni
# sesión: son los componentes reales con datos de prueba en memoria. Se publica
# en GitHub Pages para poder abrirlo desde el teléfono.
on:
  push:
    branches: [claude/work-queue-capacity-app-slhotq, main]
    paths:
      - "demo/**"
      - "src/components/**"
      - "src/app/globals.css"
      - "src/lib/format.ts"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run demo
      - uses: actions/configure-pages@v5
        with:
          # Habilita Pages solo, sin que nadie tenga que entrar a Settings.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
